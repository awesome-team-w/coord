name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest # cross-compiled; the macos-13 x64 runner is retired
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=coord-${{ github.ref_name }}-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C cli/target/${{ matrix.target }}/release coord
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            coord-*.tar.gz
            coord-*.tar.gz.sha256
