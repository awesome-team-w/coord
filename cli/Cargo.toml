[package]
name = "coord"
version = "0.1.0"
edition = "2021"
description = "A shared task ledger coordinating parallel coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.30"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
